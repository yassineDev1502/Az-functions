
name: Build and deploy .NET 10 Azure Function - azurefunctions1

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: AzureFunctionsDemo
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/AzureFunctionsDemo.csproj"

      - name: Build project
        run: dotnet build "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/AzureFunctionsDemo.csproj" --configuration Release --no-restore

      - name: Publish Azure Function
        run: dotnet publish "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/AzureFunctionsDemo.csproj" --configuration Release --no-build --output ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CA45E497593447CCAB4706741FFC88CA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3944E6BE6A8846DEBBD3DCC79DF38FB4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8D3171725C33488D9D96BEE83CBF872F }}

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: azurefunctions1
          package: ./publish
          sku: flexconsumption
          remote-build: false
